[tools]
node = "24.22.1"

# GITHUB_PACKAGES_TOKEN is set in mise.local.toml (gitignored), a PAT with
# read:packages scope, used by .npmrc to install @rogueserenity/mykeebs-brand
# from GitHub Packages.

[tasks.deploy-dev]
description = "Deploy the current branch to https://beta.mykeebs.com until the next merge to main redeploys it: mise run deploy-dev (needs wrangler login)"
run = ["npm run build", "npx wrangler deploy"]
